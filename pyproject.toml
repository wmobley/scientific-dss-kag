[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "scientific-dss-kag"
version = "0.1.0"
description = "Decision Pathways guided scientific DSS research testbed"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "rdflib==7.6.0", "pyshacl==0.40.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "build==1.6.1"]

[project.scripts]
scientific-dss = "scientific_dss_kag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_dss_kag"]

[tool.hatch.build.targets.wheel.force-include]
"ontology" = "scientific_dss_kag/resources/ontology"
"domains" = "scientific_dss_kag/resources/domains"
"experiments/benchmarks" = "scientific_dss_kag/resources/benchmarks"

[tool.pytest.ini_options]
testpaths = ["tests"]
